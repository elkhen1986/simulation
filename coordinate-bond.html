<style>
:root{color-scheme:dark;--bg:#080D15;--pan:#101927;--pan2:#162234;--ink:#E8EEF6;--mut:#8B9BB0;--line:#25354A;--cat:#FF7A5C;--an:#3CC9C3;--e:#FFC93C;--ok:#4BD184;--bad:#FF8A80;--glow:#14213A;box-sizing:border-box}
:root[data-theme="light"]{color-scheme:light;--bg:#EDF2F8;--pan:#fff;--pan2:#F2F6FB;--ink:#14212F;--mut:#586A7E;--line:#D2DCE7;--cat:#D2492F;--an:#0C8A86;--e:#E09A00;--ok:#1B8A4B;--bad:#B3261E;--glow:#D9E5F3}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 500px at 50% -10%,var(--glow),var(--bg));background-color:var(--bg);color:var(--ink);font:400 16px/1.6 Tajawal,system-ui,sans-serif;overflow:hidden}
.wrap{max-width:1100px;height:100%;margin:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 54px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:Cairo,Tajawal,sans-serif;font-size:clamp(18px,2.6vw,26px);margin:0;font-weight:800;background:linear-gradient(90deg,var(--ink),var(--e));-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{display:flex;gap:8px;align-items:center}
.ib{display:inline-flex;align-items:center;gap:8px;min-width:42px;height:42px;padding:0 12px;justify-content:center;border-radius:99px;border:1px solid var(--line);background:var(--pan);color:var(--ink);font:inherit;transition:.2s}
.ib:hover{border-color:var(--e);transform:translateY(-2px);box-shadow:0 6px 16px #0004;color:var(--e)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:.25s}.sw i{position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.25s}
[aria-checked="true"] .sw{background:var(--e)}[aria-checked="true"] .sw i{inset-inline-start:16px;background:#1a1200}
nav{display:flex;align-items:center;justify-content:center;gap:0}
nav button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--pan);color:var(--mut);font:inherit;font-weight:700;display:grid;place-items:center;transition:.2s}
nav button:hover:not(:disabled){border-color:var(--e);color:var(--e);transform:scale(1.1)}
nav .on{border-color:var(--e);background:var(--e);color:#1a1200;box-shadow:0 0 0 4px #ffc93c30}nav .dn{border-color:var(--ok);color:var(--ok)}nav button:disabled{opacity:.35}
.ln{flex:0 0 34px;height:2px;background:var(--line)}
:focus-visible{outline:3px solid var(--e);outline-offset:2px}
#app{flex:1;min-height:0}
.card{height:100%;background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;box-shadow:0 20px 50px #0003}
h2{font-size:18px;margin:0}h3{margin:0;font-size:16px}.mut{color:var(--mut);margin:0;font-size:14px}.note{color:var(--mut);font-size:13px;margin:6px 0 0}
.grow{flex:1;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:10px;flex:1;min-height:0}
@media(max-width:860px){.tiles{grid-template-columns:repeat(4,1fr)}}
.t{--c:#888;position:relative;overflow:hidden;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--c) 26%,var(--pan2)),var(--pan2) 75%);color:var(--ink);border-radius:16px;padding:6px;font:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:rise .5s both;animation-delay:calc(var(--i)*45ms);transition:transform .2s,box-shadow .2s,border-color .2s}
.t .s{font-size:clamp(22px,3.6vw,34px);font-weight:700;direction:ltr;line-height:1.1;color:color-mix(in srgb,var(--c) 75%,var(--ink))}.t small{color:var(--mut);font-size:12px}
.t:hover{transform:translateY(-5px) scale(1.04);border-color:var(--c);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 38%,transparent)}
.t.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent),0 14px 30px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(-3px)}
.t.sel::after{content:"✓";position:absolute;top:6px;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#111;font-size:13px;font-weight:700;display:grid;place-items:center;animation:pop .4s both}
.msg{min-height:24px;font-weight:500;font-size:15px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{border:0;background:linear-gradient(135deg,var(--e),#ff9d3c);color:#1a1200;min-width:50px;height:44px;padding:0 20px;border-radius:12px;font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s,box-shadow .18s,opacity .2s}
